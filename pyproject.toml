[tool.ruff]

# Only look at Python files (default behavior)
include = ["*.py"]

# Directories to skip
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".ruff_cache",
    ".idea",
    ".vscode",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

# Enable only syntax-related rules:
# F-series = Pyflakes (syntax + runtime errors)
# E9 = Syntax errors (subset of pycodestyle errors)
# PL = Ruff's own syntax checks
lint.select = ["F", "E9", "PL"]

# Disable documentation rules (D-series)
# Note: not needed because D-series is not included in select, but included here for clarity
lint.ignore = ["D"]

# Optional: show warnings instead of blocking PR formatting issues
# (Ruff exits with non-zero for real errors only)