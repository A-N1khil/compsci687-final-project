name: Ruff Lint

on:
  pull_request:
    branches:
      - develop          # Only run when PR targets develop
    paths:
      - "**/*.py"        # Only run if Python files change
      - ".github/workflows/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check .
